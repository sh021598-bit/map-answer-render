# The Map Answer 음성 생성: Chatterbox 음성 + Whisper 검수 (공개 레포 = Actions 무료, 2026-10-29 my-first-fmcode 에서 이전)
# tts/job.json {configs, lines} → tts-run 브랜치에 새 커밋 푸시 → tts-out 브랜치 tts/<config>/NN.wav, words.json, check.txt (매번 덮어씀)
# 통과하면 wav·words.json 을 main voice/<NNN>_<name>/ 로 복사. 음색 ref/*.wav 는 Kokoro 합성 음성(사람 목소리 아님)
name: TTS

on:
  push:
    branches: [tts-run]

permissions:
  contents: write

concurrency:
  group: tts

jobs:
  gen:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.11"}
      - run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL
          pip install -q --no-cache-dir torch==2.6.0 torchaudio==2.6.0 --index-url https://download.pytorch.org/whl/cpu
          pip install -q --no-cache-dir chatterbox-tts faster-whisper
      - working-directory: tts
        run: |
          for c in $(python -c "import json;print(' '.join(json.load(open('job.json'))['configs']))"); do
            L=$(python -c "import json;print(json.load(open('job.json'))['lines'])")
            python cb_gen.py $c $L out/$c && python align.py out/$c $L
          done
      - run: |
          cd tts/out && git init -q . && git checkout -q -b tts-out && mkdir tts && mv cb_* turbo_* tts/ 2>/dev/null || true
          git config user.name "github-actions[bot]" && git config user.email "github-actions[bot]@users.noreply.github.com"
          git add tts && git commit -qm "tts ${{ github.sha }}"
          git push -f "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" tts-out
