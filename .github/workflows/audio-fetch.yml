# 무료 음원 후보 받기 — audio-fetch 브랜치 푸시 때만 (main 워크플로와 별개). 결과를 같은 브랜치 audio/out 에 커밋
name: Audio fetch
on:
  push:
    branches: [audio-fetch]
    paths: [audio/fetch3.py, .github/workflows/audio-fetch.yml]
permissions:
  contents: write
jobs:
  fetch:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - run: sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg >/dev/null
      - run: python3 audio/fetch3.py
      - run: |
          git config user.name audio-fetch && git config user.email audio-fetch@users.noreply.github.com
          git add audio && git commit -qm "audio candidates" && git push -q origin HEAD:audio-fetch || echo "변경 없음"
